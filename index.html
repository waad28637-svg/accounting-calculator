<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المختبر المحاسبي</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #1f4e79;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #ccc;
    }

    h2 {
      color: #1f4e79;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #1f4e79;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #eef5fb;
      border-radius: 8px;
      font-weight: bold;
    }

    .option {
      display: block;
      width: 100%;
      margin: 8px 0;
      background: #eee;
      color: #222;
    }

    .correct {
      background: #d4edda !important;
      color: #155724 !important;
    }

    .wrong {
      background: #f8d7da !important;
      color: #721c24 !important;
    }
  </style>
</head>

<body>

  <h1>🧮 المختبر المحاسبي</h1>

  <!-- الربح والخسارة -->
  <div class="card">
    <h2>💰 حاسبة الربح والخسارة</h2>

    <label>الإيرادات</label>
    <input type="number" id="revenue" placeholder="مثال: 10000">

    <label>المصروفات</label>
    <input type="number" id="expenses" placeholder="مثال: 6000">

    <button onclick="profitLoss()">احسب</button>

    <div class="result" id="profitResult"></div>
  </div>


  <!-- هامش الربح -->
  <div class="card">
    <h2>📊 حاسبة هامش الربح</h2>

    <label>صافي الربح</label>
    <input type="number" id="netProfit" placeholder="مثال: 4000">

    <label>الإيرادات</label>
    <input type="number" id="marginRevenue" placeholder="مثال: 10000">

    <button onclick="profitMargin()">احسب</button>

    <div class="result" id="marginResult"></div>
  </div>


  <!-- الخصم -->
  <div class="card">
    <h2>🏷️ حاسبة الخصم</h2>

    <label>السعر الأصلي</label>
    <input type="number" id="originalPrice" placeholder="مثال: 1000">

    <label>الخصم %</label>
    <input type="number" id="discount" placeholder="مثال: 10">

    <button onclick="discountCalc()">احسب</button>

    <div class="result" id="discountResult"></div>
  </div>


  <!-- نقطة التعادل -->
  <div class="card">
    <h2>⚖️ حاسبة نقطة التعادل</h2>

    <label>التكاليف الثابتة</label>
    <input type="number" id="fixedCosts" placeholder="مثال: 5000">

    <label>سعر بيع الوحدة</label>
    <input type="number" id="sellingPrice" placeholder="مثال: 100">

    <label>التكلفة المتغيرة للوحدة</label>
    <input type="number" id="variableCost" placeholder="مثال: 50">

    <button onclick="breakEven()">احسب</button>

    <div class="result" id="breakEvenResult"></div>
  </div>


  <!-- التمرين المحاسبي -->
  <div class="card">
    <h2>📝 تمرين محاسبي تفاعلي</h2>

    <p>
      اشترت المنشأة بضاعة نقدًا بمبلغ <strong>2,000 ريال</strong>.
      <br><br>
      ما الحساب الذي يُسجّل <strong>مدينًا</strong>؟
    </p>

    <button class="option" onclick="answer(this, false)">الصندوق</button>
    <button class="option" onclick="answer(this, false)">المبيعات</button>
    <button class="option" onclick="answer(this, true)">المشتريات</button>
    <button class="option" onclick="answer(this, false)">رأس المال</button>

    <div class="result" id="answerResult"></div>
  </div>


  <script>

    function profitLoss() {
      let revenue = Number(document.getElementById("revenue").value);
      let expenses = Number(document.getElementById("expenses").value);

      let profit = revenue - expenses;

      document.getElementById("profitResult").innerText =
        "الربح = " + profit.toFixed(2) + " ريال";
    }


    function profitMargin() {
      let profit = Number(document.getElementById("netProfit").value);
      let revenue = Number(document.getElementById("marginRevenue").value);

      if (revenue === 0) {
        document.getElementById("marginResult").innerText =
          "يرجى إدخال إيرادات أكبر من صفر";
        return;
      }

      let margin = (profit / revenue) * 100;

      document.getElementById("marginResult").innerText =
        "هامش الربح = " + margin.toFixed(2) + "%";
    }


    function discountCalc() {
      let price = Number(document.getElementById("originalPrice").value);
      let discount = Number(document.getElementById("discount").value);

      let discountAmount = price * (discount / 100);
      let finalPrice = price - discountAmount;

      document.getElementById("discountResult").innerText =
        "مبلغ الخصم = " + discountAmount.toFixed(2) +
        " ريال | السعر بعد الخصم = " + finalPrice.toFixed(2) + " ريال";
    }


    function breakEven() {
      let fixed = Number(document.getElementById("fixedCosts").value);
      let selling = Number(document.getElementById("sellingPrice").value);
      let variable = Number(document.getElementById("variableCost").value);

      let contribution = selling - variable;

      if (contribution <= 0) {
        document.getElementById("breakEvenResult").innerText =
          "لا يمكن حساب نقطة التعادل بهذه القيم";
        return;
      }

      let units = fixed / contribution;

      document.getElementById("breakEvenResult").innerText =
        "نقطة التعادل = " + units.toFixed(2) + " وحدة";
    }


    function answer(button, correct) {
      let buttons = document.querySelectorAll(".option");

      buttons.forEach(function(btn) {
        btn.disabled = true;
      });

      if (correct) {
        button.classList.add("correct");

        document.getElementById("answerResult").innerText =
          "✅ إجابة صحيحة! المشتريات تُسجّل مدينة عند شراء البضاعة.";
      } else {
        button.classList.add("wrong");

        document.getElementById("answerResult").innerText =
          "❌ إجابة غير صحيحة. الإجابة الصحيحة هي: المشتريات.";
      }
    }

  </script>

</body>
    </html>
